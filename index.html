<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Also Starring — 90s Character Actors</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap');

:root {
  --paper: #EDE7D6;
  --paper-dark: #DED5BC;
  --ink: #201C16;
  --ink-soft: #4A443B;
  --navy: #171A22;
  --navy-2: #20242F;
  --brass: #B08D2B;
  --brass-bright: #C9A227;
  --stamp-red: #8B2E2E;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--navy);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  line-height: 1.5;
}

/* ---------- Hero ---------- */

header.hero {
  position: relative;
  padding: 6rem 1.5rem 4rem;
  text-align: center;
  border-bottom: 1px solid rgba(201,162,39,0.35);
  overflow: hidden;
}

header.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 38px,
    rgba(201,162,39,0.06) 38px,
    rgba(201,162,39,0.06) 40px
  );
  pointer-events: none;
}

h1.title {
  font-size: clamp(2.6rem, 7vw, 5rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--paper);
  line-height: 0.98;
}

h1.title span {
  display: block;
  font-size: clamp(1rem, 2.4vw, 1.3rem);
  font-weight: 400;
  letter-spacing: 0.28em;
  color: var(--brass-bright);
  margin-top: 1rem;
  text-transform: uppercase;
}

/* ---------- Grid ---------- */

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 3.5rem 1.5rem 5rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.75rem;
}

.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 3px;
  position: relative;
  box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* portrait / monogram frame */

.frame {
  position: relative;
  background: var(--navy-2);
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 18%;
  filter: grayscale(35%) contrast(1.05);
  display: block;
}

.sprockets {
  position: absolute;
  top: 0; bottom: 0;
  width: 16px;
  background: repeating-linear-gradient(
    to bottom,
    var(--ink) 0,
    var(--ink) 10px,
    transparent 10px,
    transparent 22px
  );
}
.sprockets.left { left: 0; }
.sprockets.right { right: 0; }

.monogram {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 3.6rem;
  color: rgba(237,231,214,0.9);
  letter-spacing: 0.02em;
}

.stamp {
  position: absolute;
  top: 12px;
  right: 28px;
  font-family: 'Courier Prime', monospace;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--stamp-red);
  border: 1.5px solid var(--stamp-red);
  padding: 3px 7px;
  border-radius: 2px;
  transform: rotate(-8deg);
  text-transform: uppercase;
  background: rgba(139,46,46,0.06);
  white-space: nowrap;
}

.card-body {
  padding: 1.1rem 1.3rem 1.4rem;
  border-top: 3px solid var(--navy);
}

.name {
  font-size: 1.3rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin-bottom: 0.15rem;
}

.specialty {
  font-size: 0.82rem;
  color: var(--ink-soft);
  font-style: italic;
  margin-bottom: 0.9rem;
}

.credits {
  font-family: 'Courier Prime', monospace;
  font-size: 0.76rem;
  border-top: 1px dashed rgba(32,28,22,0.3);
  padding-top: 0.7rem;
}

.credits li {
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.18rem 0;
  color: var(--ink-soft);
}

.credits li b {
  color: var(--ink);
  font-weight: 700;
}

.credits li .yr {
  color: var(--brass);
  flex-shrink: 0;
}

/* ---------- Footer ---------- */

footer {
  text-align: center;
  padding: 3rem 1.5rem 4rem;
  font-family: 'Courier Prime', monospace;
  font-size: 0.75rem;
  color: rgba(237,231,214,0.4);
  letter-spacing: 0.05em;
}

footer .credit {
  display: block;
  margin-top: 0.6rem;
  font-size: 0.65rem;
  color: rgba(237,231,214,0.28);
}

</style>
</head>
<body>

<header class="hero">
  <h1 class="title">Also Starring<span>The 1990s character actor hall of fame</span></h1>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Every one of them stole a scene from someone with top billing.<span class="credit">Photos via Wikimedia Commons (CC BY / CC BY-SA), with a few low-resolution images from Wikipedia and other sources, used here for educational identification.</span></footer>

      ["Passion Fish", "1992", "Sugar LeDoux"],
      ["Broken Arrow", "1996", "Pritchett"],
      ["Die Hard: With a Vengeance", "1995", "Joe Lambert"]
    ]
  }
];

const grid = document.getElementById('grid');
const COMMONS = 'https://commons.wikimedia.org/wiki/Special:FilePath/';

actors.forEach(a => {
  const initials = a.name.split(' ').filter(w => /[A-Za-z]/.test(w[0])).map(w => w[0]).join('').slice(0,3);

  const card = document.createElement('div');
  card.className = 'card';

  const creditsHtml = a.credits.map(c =>
    `<li><span><b>${c[0]}</b> &mdash; ${c[2]}</span><span class="yr">${c[1]}</span></li>`
  ).join('');

  const src = a.photo
    ? (a.photo.includes('/') ? a.photo : COMMONS + encodeURIComponent(a.photo) + '?width=500')
    : null;

  const visual = src
    ? `<img src="${src}" alt="${a.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'monogram',textContent:'${initials}'}))">`
    : `<div class="monogram">${initials}</div>`;

  card.innerHTML = `
    <div class="frame">
      <div class="sprockets left"></div>
      ${visual}
      <div class="sprockets right"></div>
      <div class="stamp">${a.stamp}</div>
    </div>
    <div class="card-body">
      <div class="name">${a.name}</div>
      <div class="specialty">${a.specialty}</div>
      <ul class="credits">${creditsHtml}</ul>
    </div>
  `;
  grid.appendChild(card);
});
</script>
